services:

  app:
    build: .
    image: production-final:v1
    container_name: production-app
    expose:
      - "8000"
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: production-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped